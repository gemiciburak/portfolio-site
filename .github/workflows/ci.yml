name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR'larda eski çalıştırmayı iptal et; main'de yarıda kalan yayın olmasın.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Varsayılan olarak salt okunur; yalnızca deploy işi Pages yazma izni alır.
permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci: lockfile ile package.json ayrışmışsa sessizce farklı sürüm
      # çekmek yerine hata verir.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Statik çıktı (out/) yalnızca main'e push'ta yayın için paketlenir.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Üst üste iki yayın çakışmasın; süren yayın yarıda kesilmez.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
