name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dal için üst üste gelen çalıştırmalarda eskisini iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Varsayılan olarak salt okunur; iş akışı hiçbir şey yazmıyor.
permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (lint · typecheck · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci: lockfile ile package.json ayrışmışsa sessizce farklı sürüm
      # çekmek yerine hata verir.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # API erişilemediğinde sayfalar istek anında üretilir; build yine de
      # geçerli olmalı — bu adım o davranışı da doğrular.
      - run: npm run build

  docker:
    name: Docker image build + stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Kod kontrolleri geçmeden imaj derlenmez.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # push: false — imaj yalnızca derlenir, registry'ye gönderilmez.
      # Etiketler compose'daki `image:` alanlarıyla birebir aynı; böylece
      # sonraki `compose up` imajları yeniden derlemez.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          push: false
          load: true
          tags: portfolio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrate
          push: false
          load: true
          tags: portfolio-api:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000/api
            API_URL=http://api:4000/api
          tags: portfolio-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Yığının ayağa kalktığını, migration'ın ve seed'in uygulandığını ve
      # sayfaların gerçek içerikle render edildiğini uçtan uca doğrular.
      - name: Smoke test the stack
        run: |
          set -euo pipefail

          cp .env.example .env
          cp backend/.env.example backend/.env
          # Uygulama en az 32 karakterlik JWT sırrı bekliyor.
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 32)|" backend/.env
          sed -i "s|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET=$(openssl rand -hex 32)|" backend/.env

          # Önce API: migration'lar burada uygulanır.
          docker compose up -d --wait --wait-timeout 300 api

          # Seed ŞART: profil satırı olmadan ana sayfa render edilemez.
          # Bu adım olmadan / ucu 500 döner (içerik yok).
          docker compose run --rm -w /app migrate npx tsx src/core/database/seed.ts

          # Frontend ancak içerik hazırken ayağa kaldırılır.
          docker compose up -d --wait --wait-timeout 300 web

          echo "── sağlık ──"
          curl --fail --silent --show-error http://localhost:4000/api/health \
            | tee /dev/stderr | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://localhost:3000/api/health \
            | tee /dev/stderr | grep -q '"status":"ok"'

          echo "── herkese açık uçlar ──"
          curl --fail --silent --show-error http://localhost:4000/api/projects \
            | grep -q '"success":true'
          # Seed gerçekten veri yazmış mı (boş dizi kabul edilmez).
          curl --fail --silent --show-error http://localhost:4000/api/site \
            | grep -q '"fullName"'

          echo "── yetkilendirme ──"
          # Korumalı uç token'sız erişilebiliyorsa bu bir güvenlik gerilemesidir.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/projects/all)" = "401"

          echo "── frontend render ──"
          # Sadece 200 yetmez: sayfa API'den gelen içeriği barındırmalı.
          curl --fail --silent --show-error http://localhost:3000/ \
            | grep -q "Full-Stack Developer"
          # Detay sayfaları da API'den üretiliyor.
          curl --fail --silent --show-error -o /dev/null http://localhost:3000/projects/pierre

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
