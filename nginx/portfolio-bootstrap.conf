# GEÇİCİ — yalnızca ilk sertifikayı almak için.
#
# Nginx, sertifika dosyası yokken SSL bloğu içeren bir konfigürasyonu kabul
# etmez; sertifika almak içinse nginx'in ACME doğrulamasını servis etmesi
# gerekir. Bu tavuk-yumurta durumunu çözmek için önce bu HTTP-only blok
# kurulur, sertifika alınır, sonra portfolio.conf ile değiştirilir.
#
#   1. cp portfolio-bootstrap.conf → conf.d/portfolio.conf   (bu dosya)
#   2. nginx -t && nginx -s reload
#   3. certbot certonly --webroot -w /var/www/certbot -d www... -d ...
#   4. cp portfolio.conf → conf.d/portfolio.conf             (üzerine yaz)
#   5. nginx -t && nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name www.burakgemici.com.tr burakgemici.com.tr;

    # Certbot'un doğrulama dosyasını okuyacağı yer.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sertifika alınana dek site yayında değil.
    location / {
        return 503;
    }
}
