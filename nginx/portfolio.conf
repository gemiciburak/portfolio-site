# www.burakgemici.com.tr — portfolyonun ters proxy'si.
#
# Bu dosya BU yığının nginx'i tarafından değil (burada nginx yok), sunucuda
# hâlihazırda çalışan nginx tarafından servis edilir. Oraya kopyalayın:
#
#   scp nginx/portfolio.conf sunucu:~/pierre/nginx/conf.d/portfolio.conf
#
# Ön koşullar (ayrıntı: DEPLOY.md):
#   1. `docker network create edge` çalıştırılmış, nginx bu ağa bağlı olmalı
#   2. www ve apex için sertifika alınmış olmalı
#
# Adlandırma not: upstream ve zone adları Pierre'inkilerle çakışmasın diye
# "portfolio_" ön ekiyle.

upstream portfolio_web {
    server portfolio-web:3000;
    keepalive 16;
}

upstream portfolio_api {
    server portfolio-api:4000;
    keepalive 16;
}

# İletişim formuna özel limit — uygulama içindeki limitin önünde ikinci kapı.
limit_req_zone $binary_remote_addr zone=portfolio_contact:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name www.burakgemici.com.tr burakgemici.com.tr;

    # Sertifika yenilemesi (webroot) HTTPS'e yönlendirilmemeli.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.burakgemici.com.tr$request_uri;
    }
}

# Çıplak alan adını www'ye taşı — tek kanonik adres.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name burakgemici.com.tr;

    ssl_certificate     /etc/letsencrypt/live/www.burakgemici.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.burakgemici.com.tr/privkey.pem;

    return 301 https://www.burakgemici.com.tr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.burakgemici.com.tr;

    ssl_certificate     /etc/letsencrypt/live/www.burakgemici.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.burakgemici.com.tr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── API ─────────────────────────────────────────────────────────────────
    # İletişim formu: en çok kötüye kullanılan uç, önce o eşleşsin.
    location = /api/messages {
        limit_req zone=portfolio_contact burst=3 nodelay;

        proxy_pass         http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /api/ {
        proxy_pass         http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # TRUST_PROXY=1 ile birlikte: rate limit gerçek istemci IP'sini görür.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Swagger dışarı açılmaz. Açmak istersen: backend/.env'de SWAGGER_ENABLED=1
    # ve burayı /api/ gibi proxy'le.
    location /docs {
        return 404;
    }

    # ── Next.js ─────────────────────────────────────────────────────────────
    # Hash'li statik dosyalar: içerik değişince ad değişir, uzun cache güvenli.
    location /_next/static/ {
        proxy_pass http://portfolio_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
