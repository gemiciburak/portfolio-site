# Ters proxy: tek alan adı, iki upstream.
#   /        → Next.js (web:3000)
#   /api/    → NestJS  (api:4000)
#
# DOMAIN yer tutucusunu kendi alan adınızla değiştirin.

upstream portfolio_web {
    server web:3000;
}

upstream portfolio_api {
    server api:4000;
}

# İletişim formuna özel limit — bot'lar Nginx'i de geçemesin.
limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name www.burakgemici.com.tr burakgemici.com.tr;

    # Let's Encrypt doğrulaması HTTPS'e yönlendirilmemeli.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.burakgemici.com.tr$request_uri;
    }
}

# Çıplak alan adını www'ye taşı — tek kanonik adres.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name burakgemici.com.tr;

    ssl_certificate     /etc/letsencrypt/live/www.burakgemici.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.burakgemici.com.tr/privkey.pem;

    return 301 https://www.burakgemici.com.tr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.burakgemici.com.tr;

    ssl_certificate     /etc/letsencrypt/live/www.burakgemici.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.burakgemici.com.tr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: tarayıcı bir daha HTTP denemez.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Yüklenen proje görselleri için pay bırakır.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # TRUST_PROXY=1 ile birlikte: rate limit gerçek istemci IP'sini görür.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # İletişim formu: uygulama limitinin önünde ikinci bir kapı.
    location = /api/messages {
        limit_req zone=contact_limit burst=3 nodelay;

        proxy_pass         http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger production'da dışarı açılmaz; gerekirse bu bloğu açın.
    location /docs {
        return 404;
    }

    # ── Next.js ─────────────────────────────────────────────────────────────
    # Hash'li statik dosyalar: içerik değişince ad değişir, uzun cache güvenli.
    location /_next/static/ {
        proxy_pass http://portfolio_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
