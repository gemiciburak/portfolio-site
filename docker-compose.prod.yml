# Production yığını — frontend + API + PostgreSQL, tek sunucuda (Google Cloud CE).
#
# Bu yığında nginx YOKTUR. 80/443'ü sunucudaki mevcut (Pierre'in) nginx'i tutar;
# portfolyo ona `edge` adlı ortak Docker ağı üzerinden bağlanır ve
# www.burakgemici.com.tr olarak yayınlanır. Ayrıntı: DEPLOY.md
#
# Ön koşul — ortak ağ bir kez oluşturulur:
#   docker network create edge
#
# Kurulum:
#   cp .env.example .env                  # POSTGRES_* ve PUBLIC_ORIGIN
#   cp backend/.env.example backend/.env  # JWT sırları, ADMIN_*
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Güncelleme:
#   git pull && docker compose -f docker-compose.prod.yml up -d --build
#
# Secret'lar repoda DEĞİL, sunucudaki .env dosyalarında durur.

name: portfolio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Yalnızca iç ağda; ne host'a ne edge'e açılır.
    networks: [internal]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Tek seferlik iş: şema güncel değilse uygular, sonra çıkar.
  migrate:
    build:
      context: ./backend
      target: migrate
    image: portfolio-api:migrate
    container_name: portfolio-migrate
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  api:
    build:
      context: ./backend
      target: runner
    image: portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Nginx arkasında: rate limit gerçek istemci IP'sini görsün.
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Tek origin olduğu için tarayıcı istekleri zaten same-origin;
      # allow-list yine de açıkça sınırlı tutulur.
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-0}
    # internal: postgres'e erişim · edge: nginx'in erişimi
    networks: [internal, edge]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  web:
    build:
      context: ./frontend
      target: runner
      args:
        # Tarayıcı isteği aynı origin'e gider — alan adı imaja gömülmez.
        NEXT_PUBLIC_API_URL: /api
        # Sunucu tarafı render konteyner ağı üzerinden, doğrudan API'ye.
        API_URL: http://portfolio-api:4000/api
    image: portfolio-web:latest
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      API_URL: http://portfolio-api:4000/api
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

networks:
  # Projeye özel iç ağ (postgres burada izole).
  internal:
    driver: bridge
  # Nginx ile buluşma noktası — `docker network create edge` ile önceden var olmalı.
  edge:
    external: true
    name: edge

volumes:
  postgres_data:
