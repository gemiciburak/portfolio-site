# Geliştirme yığını — tüm servisler host'a açılır.
# Production için: docker-compose.prod.yml

name: portfolio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Tek seferlik iş: şema güncel değilse uygular, sonra çıkar.
  migrate:
    build:
      context: ./backend
      target: migrate
    image: portfolio-api:migrate
    container_name: portfolio-migrate
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  api:
    build:
      context: ./backend
      target: runner
    image: portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  web:
    build:
      context: ./frontend
      target: runner
      args:
        # Tarayıcı host üzerinden eriştiği için localhost.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        # Sunucu tarafı render konteyner ağı üzerinden gider.
        API_URL: http://api:4000/api
    image: portfolio-web:latest
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      API_URL: http://api:4000/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
